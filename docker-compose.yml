services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ticketdb
      MYSQL_USER: ticket
      MYSQL_PASSWORD: ticketpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ticketdb
      SPRING_DATASOURCE_USERNAME: ticket
      SPRING_DATASOURCE_PASSWORD: ticketpass
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: